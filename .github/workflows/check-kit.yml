name: check-kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-kit:
    name: check-kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Kit check
        run: python3 scripts/check-kit.py

      - name: Unit tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Install smoke test (four repo types)
        run: |
          set -euo pipefail
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          for type in backend-go frontend-nextjs serverless-sam docs-hub; do
            target="$(mktemp -d)/smoke-$type"
            mkdir -p "$target"
            git -C "$target" init -q -b main
            args=(--type "$type" --target "$target" --set PROJECT_NAME=Smoke --set ORG=example --set DOCS_REPO=smoke-docs)
            python3 scripts/apply-kit.py "${args[@]}" --dry-run
            python3 scripts/apply-kit.py "${args[@]}"
            (cd "$target" && python3 scripts/sync-agents.py --check)
            echo "ok: $type"
          done
