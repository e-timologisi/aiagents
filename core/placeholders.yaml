# Global placeholders used by core templates. Format (stdlib parser, keep it flat):
#   defaults:  KEY: value   (may reference other placeholders in double braces)
#   required:  - KEY        (must be given with --set; no default)
#   descriptions: KEY: text
required:
  - PROJECT_NAME
  - ORG
  - DOCS_REPO
defaults:
  REPO_NAME: "{{TARGET_DIR_NAME}}"
  PROJECT_PURPOSE: "Purpose: describe {{PROJECT_NAME}} in one sentence."
  DEFAULT_BRANCH: main
  STACK: "(stack not set)"
  LINT_CMD: "(lint command not set)"
  TEST_CMD: "(test command not set)"
  INTEGRATION_CMD: "(integration test command not set)"
  BUILD_CMD: "(build command not set)"
  SECURITY_CMD: "(security scan command not set)"
  STAGING_URL: "(staging URL not set)"
  PROD_URL: "(production URL not set)"
  CODEOWNER: "@{{ORG}}"
  RELEASE_OWNER: "the repository owner"
  DOMAIN_NAME: "business domain"
  DOMAIN_EXPERT: "a domain expert"
  DOMAIN_RULES: "docs/rules/*.md"
  CODE_HOST_NAME: "(code host not set)"
  CODE_HOST_METHOD: "(connection method not set)"
  TRACKER_NAME: "the issue tracker"
  TRACKER_METHOD: "(connection method not set)"
  TRACKER_URL: "(tracker URL not set)"
  TRACKER_PROJECT: "(tracker project not set)"
  TRACKER_LABEL: "(tracker label not set)"
  TRACKER_KEY_PREFIX: "(ticket key prefix not set)"
  TRACKER_STATUSES: "To Do -> In Progress -> In Review -> Done"
  TRACKER_IDS: "(tracker ids not set)"
  WIKI_NAME: "the wiki"
  WIKI_URL: "(wiki URL not set)"
  WIKI_METHOD: "(connection method not set)"
  WIKI_SPACE: "(wiki space not set)"
  WIKI_PAGES: "(wiki mirror pages not set)"
  AGENT_REPORT_LABEL: agent-reported
  AGENT_REPORT_AUTHORS: collaborators
  MAX_PARALLEL_AGENTS: "3"
  MODEL_PLANNER: github-copilot/claude-opus-5.5
  MODEL_IMPLEMENTER: github-copilot/claude-sonnet-5.5
  MODEL_QUICK: github-copilot/claude-haiku-5.5
descriptions:
  PROJECT_NAME: Human-readable project name
  ORG: GitHub organisation or user that owns the repos
  DOCS_REPO: Repo holding ADRs, glossary and the service map (use the repo itself for single-repo projects)
  REPO_NAME: This repo's name (defaults to the target directory name)
  PROJECT_PURPOSE: One-sentence purpose shown at the top of AGENTS.md
  DEFAULT_BRANCH: Default/protected branch
  STACK: Language/framework summary of this repo
  LINT_CMD: Lint command
  TEST_CMD: Unit test command
  INTEGRATION_CMD: Integration test command
  BUILD_CMD: Build command
  SECURITY_CMD: Security scan command (SAST, dependency audit)
  STAGING_URL: Staging URL
  PROD_URL: Production URL
  CODEOWNER: CODEOWNERS owner (user or team)
  RELEASE_OWNER: Who runs production releases
  DOMAIN_NAME: Domain reviewed by domain-reviewer
  DOMAIN_EXPERT: Who validates legal/domain claims
  DOMAIN_RULES: Rule files domain-reviewer reads
  CODE_HOST_NAME: Code host recorded by /setup (for example GitHub, GitLab, other, none)
  CODE_HOST_METHOD: "How agents reach the code host: mcp, cli, api or manual (no secrets)"
  TRACKER_METHOD: "How agents reach the tracker: mcp, cli, api or manual (no secrets)"
  TRACKER_NAME: Name of the ticket system the ticket-tracker agent updates (for example Jira); GitHub Issues work without this agent
  TRACKER_URL: Base URL of the tracker site
  TRACKER_PROJECT: Tracker project the agent may touch (it refuses every other project)
  TRACKER_LABEL: Label a ticket must carry before the agent may touch it
  TRACKER_KEY_PREFIX: Ticket key prefix (for example ABC for ABC-12)
  TRACKER_STATUSES: Allowed status path, in order
  TRACKER_IDS: Fixed tracker ids the agent needs (cloud/site id, epic keys); no secrets
  WIKI_NAME: Name of the wiki the agent mirrors docs to (for example Confluence)
  WIKI_URL: Base URL of the wiki or docs site (no secrets)
  WIKI_METHOD: "How agents reach the wiki: mcp, cli, api or manual (no secrets)"
  WIKI_SPACE: Wiki space or section for mirror pages
  WIKI_PAGES: Mirror page names and ids the agent may update
  AGENT_REPORT_LABEL: Label the lead adds after verifying an AGENT-REPORT (handover gate)
  AGENT_REPORT_AUTHORS: "Who may post AGENT-REPORT comments: collaborators (owner/member/collaborator association) or a comma-separated list of logins"
  MAX_PARALLEL_AGENTS: Most agents the lead runs at once under the autonomy policy
  MODEL_PLANNER: OpenCode model for planners/reviewers
  MODEL_IMPLEMENTER: OpenCode model for implementers
  MODEL_QUICK: OpenCode model for quick-tasks
  TARGET_DIR_NAME: Set automatically to the target directory name
