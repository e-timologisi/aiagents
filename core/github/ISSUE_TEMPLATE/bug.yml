name: Bug
description: Something behaves incorrectly. See docs/agents/ticket-standard.md.
title: "[bug] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste secrets, credentials, tokens, real personal data or full logs containing personal data. Redact first.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local
        - staging
        - production
    validations:
      required: true
  - type: textarea
    id: repos
    attributes:
      label: Suspected repos
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include redacted error messages, request IDs, version/tag.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Data exposure across users/tenants and incorrect regulated results are release blockers.
      options:
        - blocker (data exposure, wrong regulated result, data loss)
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria for the fix
      description: Including the regression test to add.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Docs to update
      description: Write "none" if none.
